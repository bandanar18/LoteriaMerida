services:
  postgres:
    image: postgres:16-alpine
    container_name: loteria-postgres
    environment:
      POSTGRES_USER: loteria
      POSTGRES_PASSWORD: loteria_dev
      POSTGRES_DB: loteria
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loteria"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
